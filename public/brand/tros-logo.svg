<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tros-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="tros-t" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tros-bg)"/>
  <!-- Subtle inner highlight -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6"/>
  <!-- Stylized T: bold stem with crossbar that lifts into a spark -->
  <g fill="url(#tros-t)">
    <!-- Crossbar -->
    <rect x="106" y="148" width="300" height="72" rx="36"/>
    <!-- Stem -->
    <rect x="220" y="148" width="72" height="216" rx="36"/>
    <!-- Spark node on the crossbar's right tip -->
    <circle cx="406" cy="184" r="34" fill="#ffffff"/>
    <circle cx="406" cy="184" r="34" fill="url(#tros-bg)" fill-opacity="0.25"/>
  </g>
  <!-- Small orbiting dot: the team -->
  <circle cx="148" cy="380" r="20" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="212" cy="404" r="13" fill="#ffffff" fill-opacity="0.55"/>
</svg>
