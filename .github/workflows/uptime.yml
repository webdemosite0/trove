name: Production monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trove-production-monitor
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public pages
        shell: bash
        run: |
          set -euo pipefail
          for path in / /pricing /privacy /terms /signup; do
            echo "Checking https://troveai.site$path"
            curl               --fail               --location               --silent               --show-error               --retry 2               --retry-delay 2               --max-time 20               --output /dev/null               "https://troveai.site$path"
          done

      - name: Check service health
        shell: bash
        run: |
          set -euo pipefail
          curl             --fail             --silent             --show-error             --retry 2             --retry-delay 2             --max-time 20             "https://troveai.site/api/health"             --output health.json

          node <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync("health.json", "utf8"));

          const failures = [];
          if (health.ok !== true) failures.push("health endpoint is not ok");
          if (health.database?.reachable !== true) failures.push("database is unreachable");
          if (health.database?.durable !== true) failures.push("database is not durable");
          if (health.configured?.ai !== true) failures.push("no AI provider is configured");

          if (Array.isArray(health.warnings) && health.warnings.length) {
            console.log("Production warnings:", health.warnings.join(", "));
          }

          if (failures.length) {
            console.error("Production monitor failed:");
            for (const failure of failures) console.error("- " + failure);
            process.exit(1);
          }

          console.log("Production health is operational.");
          NODE
