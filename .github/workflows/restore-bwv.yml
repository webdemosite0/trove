name: Restore builder-workspace-view

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download last good builder-workspace-view.tsx
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/webdemosite0/trove/f067390869f314070ea269b65f7dda0a2c0f0f4e/src/lib/builder-workspace-view.tsx" -o src/lib/builder-workspace-view.tsx
          # Soft-patch: insert projectId prop if missing
          python3 -c "
          from pathlib import Path
          p = Path('src/lib/builder-workspace-view.tsx')
          t = p.read_text()
          needle = 'files={files}\n                  activeTab='
          insert = 'files={files}\n                  projectId={projectId}\n                  activeTab='
          if 'projectId={projectId}' not in t and needle in t:
              t = t.replace(needle, insert, 1)
              p.write_text(t)
              print('inserted projectId prop')
          else:
              print('no prop change needed or already present')
          print('size', p.stat().st_size)
          "

      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/builder-workspace-view.tsx
          git status
          git diff --cached --stat
          git commit -m "Restore builder-workspace-view.tsx (preview projectId wiring)" || echo "nothing to commit"
          git push
